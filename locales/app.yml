en:
  welcome: >
    I'm a reminder bot. Send me a reminder in this format: 
    `!remind %{date} [at] 15:30 <reminder text>`. You can replace the month number with its name,
    use words `today` or `tomorrow`. If no time was specified the reminder will arrive at 09:00.
    I'll send it to you in a shared or private chat.
  reminder.command: remind
  reminder.saved: ⏲️ Remind you on %{date} at %{hour}:%{min}
  reminder.list: >
    %{text} on %{date} at %{time}
  reminder.new: >
    🟢 Reminder for you: %{text}
  reminder.summary: |
    ⚠️ Missed reminders in this room: 
    %{sum}
  reminder.error.date: Unable to determine the reminder month.
  reminder.error.time: Wrong time.
  reminder.error.time-past: The reminder time has already passed.

  dates.today: today
  dates.tomorrow: tomorrow
  times.morning: morning
  times.afternoon: afternoon
  times.evening: evening

  months: january february march april may june july august september october november december
de: 
  welcome: >
    Ich bin ein Erinnerungs-Bot. Sende mir eine Erinnerung in diesem Format: 
    `!remind %{date} [at] 15:30 <Erinnerungstext>`. 
    Du kannst die Monatsnummer durch den Monatsnamen ersetzen.
    Verwende Wörter wie „heute“ oder „morgen“. Wenn keine Uhrzeit angegeben wurde, 
    kommt die Erinnerung um 9:00 Uhr. Ich sende sie dir in einem gemeinsamen oder privaten Chat.
  reminder.command: erinnern
  reminder.saved: ⏲️ Erinnerung am %{date} um %{hour}:%{min}
  reminder.list: >
    %{text} am %{date} um %{time}
  reminder.new: >
    🟢 Zur Erinnerung: %{text}
  reminder.summary: |
    ⚠️ Missed reminders in this room: 
    %{sum}
  reminder.error.date: Der Erinnerungsmonat kann nicht ermittelt werden.
  reminder.error.time: Falsche Zeit.
  reminder.error.time-past: Die Erinnerungsfrist ist bereits abgelaufen.

  dates.today: heute
  dates.tomorrow: morgen
  times.morning: morgen
  times.afternoon: nachmittag
  times.evening: abend

  months: januar februar märz april mai juni juli august september oktober november dezember
fr:
  welcome: >
    Je suis un bot de rappels. Envoyez-moi un rappel au format suivant: 
    `!remind %{date} [at] 15:30 <texte du rappel>`. Vous pouvez remplacer le numéro du mois par son nom,
    et utiliser les mots «aujourd'hui» ou «demain». Si aucune heure n'est précisée, le rappel sera envoyé à 9h00. 
    Je vous l'enverrai dans une conversation partagée ou privée.
  reminder.command: rappeler
  reminder.saved: ⏲️ Vous rappeler le %{date} à %{hour}:%{min}
  reminder.list: >
    %{text} le %{date} à %{time}
  reminder.new: >
    🟢 Petit rappel: %{text}
  reminder.summary: |
    ⚠️ Promemoria non visualizzati in questa stanza:
      %{sum}
  reminder.error.date: Impossible de déterminer le mois de rappel.
  reminder.error.time: Mauvais moment.
  reminder.error.time-past: L'heure de rappel est déjà passée.

  dates.today: aujourd'hui
  dates.tomorrow: demain
  times.morning: matin
  times.afternoon: après-midi
  times.evening: soir

  months: janvier février mars avril mai juin juillet août septembre octobre novembre décembre
